name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsis) { Write-Host "makensis: $nsis" } else { throw "makensis not found" }

      - name: Build installer
        shell: powershell
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          python build_installer.py --makensis $nsis
          if (!(Test-Path "PyClaw-for-Windows-Setup.exe")) { throw "installer not produced" }
          Get-Item "PyClaw-for-Windows-Setup.exe" | Format-List Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyClaw-for-Windows-Setup
          path: PyClaw-for-Windows-Setup.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PyClaw-for-Windows-Setup.exe
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
